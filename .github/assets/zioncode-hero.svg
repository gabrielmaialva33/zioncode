<svg width="1100" height="420" viewBox="0 0 1100 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="title desc">
  <title id="title">zioncode hero banner</title>
  <desc id="desc">A dark banner with the zioncode mountain logo, codec pipeline labels, and mint green signal
    accents.
  </desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(190 96) rotate(49) scale(430 610)">
      <stop stop-color="#bdf4c5" stop-opacity="0.44"/>
      <stop offset="0.44" stop-color="#92e7e5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#030504" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="42" y1="22" x2="424" y2="405" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8ee7e7"/>
      <stop offset="0.55" stop-color="#bff6c6"/>
      <stop offset="1" stop-color="#d8f98e"/>
    </linearGradient>
    <linearGradient id="panel" x1="468" y1="76" x2="1007" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11231f" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#07100e" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
