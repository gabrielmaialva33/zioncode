  <path d="M70 76H1014" stroke="#c7f9b8" stroke-opacity="0.07"/>
  <path d="M70 346H1014" stroke="#c7f9b8" stroke-opacity="0.07"/>

  <g filter="url(#softShadow)">
    <circle cx="220" cy="210" r="167" fill="#050a08"/>
    <g clip-path="url(#markClip)">
      <rect x="78" y="68" width="284" height="284" fill="#020403"/>
      <path fill="url(#mint)"
