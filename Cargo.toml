[workspace]
members = [
    "zion-codec",
    "zion-cli",
    "zion-stego",
    "zion-optical",
    "zion-arc",
    "zion-corpus",
    "zion-android",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gabrielmaialva33/zioncode"
rust-version = "1.95"

[workspace.dependencies]
zstd = "0.13"
reed-solomon = "0.2"
blake3 = "1.5"
crc32c = "0.6"
uuid = { version = "1.10", features = ["v4"] }
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
proptest = "1.5"
criterion = { version = "0.8.2", features = ["html_reports"] }
hex-literal = "1.1.0"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_chacha = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
png = "0.18.1"
rpassword = "7"
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rustix = { version = "1.1", features = ["fs"] }
