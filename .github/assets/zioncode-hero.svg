    <rect x="468" y="76" width="560" height="268" rx="26" fill="url(#panel)" stroke="#9ee7d8"
          stroke-opacity="0.18"/>
    <text x="510" y="148" fill="#f3fff8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58"
